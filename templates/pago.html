<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagar productos - Supermarket</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* --- ESTILOS (Sin cambios, los mismos que proporcionaste) --- */
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f9fc; 
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- HEADER PRINCIPAL --- */
        .header-container {
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 40px;
            display: flex;
            justify-content: center; /* Centra el logo */
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
            background-image: url("{{ url_for('static', filename='images/fondos/InicioSesion2.jpg') }}");
            background-size: cover; 
            background-position: center 40%; 
            position: relative; /* Cambiado de 'fixed' a 'relative' o 'sticky' si prefieres */
            z-index: 1;
             /* position: sticky; */ /* Descomenta si quieres header pegajoso */
             /* top: 0; */        /* Descomenta si quieres header pegajoso */
        }

        .header-container::before {
            content: ''; 
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 40, 120, 0.6); 
            z-index: -1; 
        }

        .logo-link {
            text-decoration: none;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-cart-icon {
            height: 55px;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.5)); 
        }

        .logo-text {
            font-size: 2.2em;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            color: white;
        }

        .green-letter { color: #28a745; }
        .orange-letter { color: #f39c12; }

        /* --- Menú hamburguesa izquierdo --- */
        .menu-icon {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 25px;
            height: 20px;
            cursor: pointer;
            position: absolute;
            top: 50%; /* Centrado vertical */
            transform: translateY(-50%); /* Ajuste fino vertical */
            left: 20px; 
            z-index: 3;
        }

        .menu-icon .bar {
            height: 3px;
            width: 100%;
            background-color: white;
            border-radius: 2px;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: -250px; /* Oculto inicialmente */
            width: 250px;
            height: 100%;
            background-color: #2c3e50;
            color: white;
            transition: left 0.3s ease-in-out; /* Transición suave */
            padding-top: 60px;
            z-index: 1001; /* Encima del overlay */
            box-shadow: 2px 0 5px rgba(0,0,0,0.2); /* Sombra sutil */
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar ul {
            list-style: none;
            padding: 0 20px; /* Padding interno */
        }

        .sidebar ul li {
            margin: 15px 0; /* Espaciado ajustado */
        }

        .sidebar ul li a {
            color: white;
            text-decoration: none;
            font-size: 1.1em;
            padding: 10px 15px; /* Padding ajustado */
            display: block;
            border-radius: 6px;
             transition: background-color 0.2s ease;
        }

        .sidebar ul li a:hover {
            background-color: #34495e;
        }

        .sidebar .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2em;
            cursor: pointer;
            color: #bdc3c7; /* Color más suave */
             transition: color 0.2s ease;
        }
         .sidebar .close-btn:hover {
            color: white;
         }

        /* Overlay */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6); /* Más oscuro */
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-in-out, visibility 0s linear 0.3s; /* Asegura que no sea clickeable cuando oculto */
            z-index: 1000; /* Debajo del sidebar */
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
             transition: opacity 0.3s ease-in-out;
        }
        
        /* --- CONTENIDO PRINCIPAL --- */
        .pago-contenedor {
            max-width: 1100px; 
            width: 90%; /* Más ancho en pantallas grandes */
            margin: 30px auto 50px auto; 
            padding: 30px; /* Padding reducido */
            background-color: white;
            border-radius: 12px; /* Menos redondeado */
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1); /* Sombra más suave */
            display: grid;
            grid-template-columns: 1fr 1.3fr; /* Dar más espacio al formulario */
            gap: 40px; 
            /* Quitamos fondo y overlay interno, usamos el global */
        }
        
        /* Ajustes para el fondo global si se usa un contenedor interno */
        /* .pago-contenedor::before { ... } ya no es necesario si el fondo está en body */
        /* .pago-contenedor > * { ... } ya no es necesario */

        .resumen {
             /* Quitar padding extra si ya está en pago-contenedor */
             /* padding: 30px; */ 
            border-radius: 8px; /* Redondeo consistente */
            background-color: #f8f9fa; /* Fondo ligero */
             border: 1px solid #e9ecef; /* Borde sutil */
            font-size: 1em; /* Tamaño base */
        }

        .resumen h2 {
            border-bottom: 2px solid #dee2e6; /* Borde más suave */
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 1.4em; /* Tamaño ajustado */
             color: #343a40; /* Color oscuro */
        }

        .resumen table {
            width: 100%;
            border-collapse: collapse;
        }
        
        /* Estilos de tabla más limpios */
        .resumen th, .resumen td {
             padding: 10px 5px; /* Padding ajustado */
             border-bottom: 1px solid #e9ecef; /* Borde más suave */
             text-align: left; /* Alinear texto a la izquierda */
        }
         .resumen th {
            color: #6c757d; /* Color gris para encabezados */
            font-weight: 500;
             font-size: 0.9em;
             text-transform: uppercase;
         }
        
        .resumen td:last-child {
             text-align: right; /* Alinear precios a la derecha */
        }

        .resumen tr:last-child td {
             border-bottom: none; /* Quitar borde en la última fila */
        }

        .resumen tr.total td {
            font-weight: bold;
            color: #28a745; /* Verde para el total */
            font-size: 1.2em; /* Total más grande */
            padding-top: 15px; /* Más espacio arriba del total */
        }

        .formulario {
             /* Quitar padding extra si ya está en pago-contenedor */
             /* padding: 30px; */
            border-radius: 8px; /* Redondeo consistente */
            background-color: #ffffff; /* Fondo blanco */
             border: 1px solid #e9ecef; /* Borde sutil */
            font-size: 1em; /* Tamaño base */
        }

        .formulario h2 {
            font-size: 1.4em; /* Tamaño ajustado */
            margin-bottom: 25px; /* Más espacio debajo */
            font-weight: 600; /* Ligeramente menos bold */
             color: #343a40;
        }

        .formulario label {
            display: block;
            margin-top: 18px; /* Más espacio entre campos */
            margin-bottom: 5px; /* Menos espacio antes del input */
            font-weight: 500;
            color: #495057; /* Gris oscuro */
             font-size: 0.95em;
        }

        .formulario input,
        .formulario textarea {
            width: calc(100% - 24px); /* Ajustar ancho por padding */
            padding: 12px;
            font-size: 1em;
            border: 1px solid #ced4da; /* Borde gris */
            border-radius: 6px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
             background-color: #fff; /* Asegurar fondo blanco */
        }
        
        /* Ajuste para textarea */
         .formulario textarea {
             resize: vertical; /* Permitir redimensionar solo verticalmente */
             min-height: 80px; /* Altura mínima */
         }


        .formulario input:focus,
        .formulario textarea:focus {
            border-color: #80bdff; /* Azul suave al enfocar */
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25); /* Resplandor azul */
            outline: none;
        }

        .tarjeta-datos {
            display: grid; /* Usar grid para mejor alineación */
            grid-template-columns: 1fr 1fr; /* Dos columnas iguales */
            gap: 20px;
            margin-top: 5px; /* Reducir margen superior */
        }
        /* Quitar divs extra si no son necesarios */
        /* .tarjeta-datos > div { ... } */

        .action-buttons {
            display: flex;
            justify-content: space-between; /* Botones en extremos */
            gap: 15px; /* Espacio reducido */
            margin-top: 30px; /* Espacio ajustado */
        }

        .btn-pagar, .btn-cancelar {
            flex: 1; /* Ocupan espacio igual */
            padding: 12px 20px; /* Padding ajustado */
            font-size: 1em; /* Tamaño base */
            font-weight: 600;
            border-radius: 6px; /* Redondeo consistente */
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease; /* Transiciones suaves */
             text-align: center; /* Centrar texto */
        }

        .btn-pagar {
            background-color: #28a745; /* Verde */
            color: white;
        }

        .btn-pagar:hover {
            background-color: #218838; /* Verde oscuro */
        }
        
         .btn-pagar:active {
             transform: scale(0.98); /* Efecto al presionar */
         }

        .btn-cancelar {
            background-color: #dc3545; /* Rojo */
            color: white;
            text-decoration: none;
            display: inline-flex; /* Para alinear icono y texto */
            align-items: center;
            justify-content: center;
        }

        .btn-cancelar:hover {
            background-color: #c82333; /* Rojo oscuro */
        }
        
        .btn-cancelar:active {
            transform: scale(0.98);
        }
        
        /* Iconos dentro de botones */
         .btn-pagar i, .btn-cancelar i {
             margin-right: 8px; /* Espacio entre icono y texto */
         }

        footer {
            text-align: center;
            padding: 20px 0; /* Más padding */
            background-color: #343a40; /* Gris más oscuro */
            color: #adb5bd; /* Texto gris claro */
            width: 100%;
            margin-top: auto; /* Empuja al final */
             font-size: 0.9em;
        }

        @media (max-width: 900px) { /* Punto de quiebre ajustado */
            .pago-contenedor {
                grid-template-columns: 1fr; /* Una sola columna */
                width: 95%; /* Ocupa casi todo el ancho */
                padding: 20px; /* Menos padding */
                gap: 30px;
            }
             .resumen {
                 order: -1; /* Mover resumen arriba en móvil */
             }

            .logo-text {
                font-size: 1.8em;
            }
            
            .tarjeta-datos {
                grid-template-columns: 1fr; /* Una columna para datos de tarjeta */
            }

            .resumen, .formulario {
                font-size: 0.95em; /* Ligeramente más pequeño */
            }
             .action-buttons {
                 flex-direction: column; /* Apilar botones */
             }
             .btn-pagar, .btn-cancelar {
                 width: 100%; /* Botones ocupan todo el ancho */
             }
        }
    </style>
</head>

<body>

    <header class="header-container">
        <div class="menu-icon" id="menu-icon">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <nav class="sidebar" id="sidebar-nav">
            <a href="#" class="close-btn" id="close-btn">×</a>
            <ul>
                <li><a href="{{ url_for('home') }}">Inicio</a></li> {/* Enlace a Home */}
                <li><a href="{{ url_for('login') }}">Iniciar sesión</a></li>
                <li><a href="{{ url_for('promociones') }}">Promociones</a></li>
                <li><a href="{{ url_for('sucursales') }}">Sucursales</a></li>
                <li><a href="{{ url_for('ayuda') }}">Ayuda</a></li>
                <li><a href="{{ url_for('opciones') }}">Opciones</a></li>
            </ul>
        </nav>
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <a href="{{ url_for('home') }}" class="logo-link">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='images/iconoCarrito.png') }}" alt="Logo SuperMarket" class="logo-cart-icon">
                <div class="logo-text">
                    SUPE<span class="green-letter">RMA</span><span class="orange-letter">RKET</span>
                </div>
            </div>
        </a>
    </header>

    <main class="pago-contenedor">
        <section class="resumen">
            <h2>Resumen de compra</h2>
            <table>
                <thead> <tr><th>Producto</th><th>Cantidad</th><th>Subtotal</th></tr>
                </thead>
                <tbody id="cart-summary-table-body"> 
                    </tbody>
                <tfoot> <tr class="total">
                        <td colspan="2">Total</td>
                        <td id="cart-summary-total">$0.00</td>
                    </tr>
                </tfoot>
            </table>
        </section>

        <section class="formulario">
            <h2>Datos de pago y envío</h2>
            <form id="payment-form" action="{{ url_for('pago') }}" method="POST"> 
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>

                <label for="direccion">Dirección de envío:</label>
                <textarea id="direccion" name="direccion" rows="3" required></textarea>

                <label for="tarjeta">Número de tarjeta:</label>
                <input type="text" id="tarjeta" name="tarjeta" pattern="\d{16}" title="Debe contener 16 dígitos" maxlength="16" placeholder="XXXX XXXX XXXX XXXX" required>

                <div class="tarjeta-datos">
                    <div>
                        <label for="expira">Expira (MM/AA):</label>
                        <input type="text" id="expira" name="expira" pattern="\d{2}/\d{2}" title="Formato MM/AA" maxlength="5" placeholder="MM/AA" required>
                    </div>
                    <div>
                        <label for="cvv">CVV:</label>
                        <input type="text" id="cvv" name="cvv" pattern="\d{3}" title="Debe contener 3 dígitos" maxlength="3" required>
                    </div>
                </div>

                <input type="hidden" id="cart-data-input" name="cart_data">

                <div class="action-buttons">
                    <button type="submit" class="btn-pagar"><i class="fas fa-lock"></i> Pagar ahora</button>
                    <a href="{{ url_for('home') }}" class="btn-cancelar"><i class="fas fa-times-circle"></i> Cancelar</a>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2025 SuperMarket - Todos los derechos reservados</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cartSummaryTableBody = document.getElementById('cart-summary-table-body');
            const cartSummaryTotal = document.getElementById('cart-summary-total');
            const cartDataInput = document.getElementById('cart-data-input');
            const paymentForm = document.getElementById('payment-form'); // Obtener el formulario

            let cart = {};
            let grandTotal = 0;

            try {
                const storedCart = localStorage.getItem('shoppingCartData');
                if (storedCart) {
                    cart = JSON.parse(storedCart);
                }
            } catch (e) {
                console.error("Error al cargar/parsear el carrito de localStorage:", e);
                // Opcional: Mostrar mensaje al usuario
            }

            // Limpiar tabla antes de llenarla
            if (cartSummaryTableBody) {
                 cartSummaryTableBody.innerHTML = ''; 
            } else {
                 console.error("Elemento #cart-summary-table-body no encontrado");
                 return; // Salir si la tabla no existe
            }


            const productIds = Object.keys(cart);

            if (productIds.length > 0) {
                productIds.forEach(id => {
                    const product = cart[id];
                    if (product.quantity > 0) {
                        const itemTotal = product.price * product.quantity;
                        grandTotal += itemTotal;

                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${product.name}</td>
                            <td>${product.quantity}</td>
                            <td>$${itemTotal.toFixed(2)}</td>
                        `;
                        cartSummaryTableBody.appendChild(row);
                    }
                });
            } else {
                 // Si el carrito está vacío, mostrar mensaje en la tabla
                 const emptyRow = document.createElement('tr');
                 emptyRow.innerHTML = `<td colspan="3" style="text-align: center; color: #6c757d;">Tu carrito está vacío.</td>`;
                 cartSummaryTableBody.appendChild(emptyRow);
            }


            // Actualizar el total en la tabla
            if (cartSummaryTotal) {
                 cartSummaryTotal.textContent = `$${grandTotal.toFixed(2)}`;
            } else {
                console.error("Elemento #cart-summary-total no encontrado");
            }
            

            // Preparar datos para enviar (antes de que el formulario se envíe)
            if (paymentForm && cartDataInput) {
                // Convertir el objeto 'cart' a un string JSON
                const cartJsonString = JSON.stringify(cart);
                // Asignar el string JSON al valor del input oculto
                cartDataInput.value = cartJsonString;

                 // Opcional: Escuchar el evento submit para asegurar que el valor esté actualizado
                 paymentForm.addEventListener('submit', () => {
                     // Volver a calcular por si acaso, aunque con DOMContentLoaded debería bastar
                      let currentCart = {};
                      try { const sc = localStorage.getItem('shoppingCartData'); if(sc) currentCart=JSON.parse(sc); } catch(e){}
                     cartDataInput.value = JSON.stringify(currentCart);
                     console.log("Enviando datos del carrito:", cartDataInput.value); // Para depuración
                 });

            } else {
                 if (!paymentForm) console.error("Elemento #payment-form no encontrado");
                 if (!cartDataInput) console.error("Elemento #cart-data-input no encontrado");
            }
            
            // --- Lógica del Sidebar (copiada de main.js, necesaria aquí también) ---
            const menuIcon = document.getElementById('menu-icon'); // Usar ID si lo tiene
            const sidebar = document.getElementById('sidebar-nav');
            const closeBtn = document.getElementById('close-btn');
            const overlay = document.getElementById('sidebar-overlay');

            if (menuIcon && sidebar && closeBtn && overlay) {
                 menuIcon.addEventListener('click', () => {
                     sidebar.classList.add('active');
                     overlay.classList.add('active');
                 });
                 closeBtn.addEventListener('click', () => {
                     sidebar.classList.remove('active');
                     overlay.classList.remove('active');
                 });
                 overlay.addEventListener('click', () => {
                     sidebar.classList.remove('active');
                     overlay.classList.remove('active');
                 });
            } else {
                 // Avisar si falta algún elemento del menú
                 if(!menuIcon) console.error("Elemento #menu-icon no encontrado");
                 if(!sidebar) console.error("Elemento #sidebar-nav no encontrado");
                 if(!closeBtn) console.error("Elemento #close-btn no encontrado");
                 if(!overlay) console.error("Elemento #sidebar-overlay no encontrado");
            }


        });
    </script>

</body>
</html>
