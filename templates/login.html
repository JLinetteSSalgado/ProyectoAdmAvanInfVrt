<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SuperMarket</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/iconocarrito.png') }}">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-page-container">
        <div class="welcome-section">
            <h1>Welcome Back</h1>
            <p>It is a long established fact that a reader will be distracted by the readable content of a page when looking at its layout. The point of using</p>
            <div class="social-icons">
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-facebook"></i></a>
            </div>
        </div>
        <div class="login-form-section">
            <h2>Sign in</h2>
            <form class="login-form" method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="remember-me" name="remember-me">
                    <label for="remember-me">Remember Me</label>
                </div>
                <button type="submit" class="login-button">Sign in now</button>
                <div class="forgot-password">
                    <a href="#">Lost your password?</a>
                </div>
            </form>
            <div class="terms-links">
                By clicking on "Sign in now" you agree to<br>
                <a href="#">Terms of Service</a> | <a href="#">Privacy Policy</a>
            </div>
            <div class="back-to-home">
            <a href="{{ url_for('home') }}"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
        </div>
        </div>
    </div>
</body>
</html>
